<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Grill — Cashier Terminal</title>
  
  <!-- SECURITY GUARD: Instantly kicks out unauthorized users -->
  <script>
      if (!localStorage.getItem('sg_token')) {
          window.location.replace('/index.html');
      }
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="h-screen flex bg-slate-950 overflow-hidden relative">

  <div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-40 hidden lg:hidden"></div>

  <aside id="sidebar" class="w-64 glass-panel border-r border-slate-800 flex flex-col justify-between z-50 absolute inset-y-0 left-0 transform -translate-x-full lg:relative lg:translate-x-0 transition-transform duration-300 ease-in-out">
    <div>
      <div class="p-6 border-b border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <span class="text-2xl">🔥</span>
          <div>
            <h1 class="font-extrabold text-sm tracking-wider text-amber-400">SMART GRILL</h1>
            <p class="text-[10px] text-slate-500 uppercase tracking-widest">Cashier Terminal</p>
          </div>
        </div>
        <button onclick="toggleSidebar()" class="lg:hidden text-slate-400 hover:text-white">✕</button>
      </div>
      
      <nav class="p-4 space-y-2">
        <p class="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-3 ml-2">Main Menu</p>
        <button onclick="toggleModal('expensesModal'); if(window.innerWidth < 1024) toggleSidebar();" class="w-full flex items-center gap-3 px-4 py-3 bg-slate-900/50 hover:bg-amber-500/10 text-slate-300 hover:text-amber-400 text-xs font-bold rounded-xl transition border border-transparent hover:border-amber-500/20 text-left">
          <span class="text-lg">💸</span> Log Expense
        </button>
        <button onclick="toggleModal('receiptsModal'); if(window.innerWidth < 1024) toggleSidebar();" class="w-full flex items-center gap-3 px-4 py-3 bg-slate-900/50 hover:bg-amber-500/10 text-slate-300 hover:text-amber-400 text-xs font-bold rounded-xl transition border border-transparent hover:border-amber-500/20 text-left">
          <span class="text-lg">🧾</span> Shift Ledger
        </button>
        <button onclick="toggleModal('holdsModal'); if(window.innerWidth < 1024) toggleSidebar();" class="w-full flex items-center gap-3 px-4 py-3 bg-slate-900/50 hover:bg-amber-500/10 text-slate-300 hover:text-amber-400 text-xs font-bold rounded-xl transition border border-transparent hover:border-amber-500/20 text-left">
          <span class="text-lg">⏸</span> Held Orders
        </button>
      </nav>
    </div>
    <div class="p-4 border-t border-slate-800">
      <!-- FIXED LOGOUT BUTTON: Only clears auth, keeps cart/holds -->
      <button onclick="localStorage.removeItem('sg_token'); localStorage.removeItem('sg_user'); window.location.href='/index.html'" class="w-full py-3 bg-red-500/10 text-red-400 rounded-xl hover:bg-red-500/20 text-xs font-bold transition flex justify-center items-center gap-2">
        <span>🚪</span> Secure Logout
      </button>
    </div>
  </aside>

  <!-- Main POS Area -->
  <div class="flex-1 flex flex-col min-w-0 h-full relative">
    <header class="glass-panel px-4 py-3 border-b border-slate-800 flex justify-between items-center z-30 lg:hidden">
      <div class="flex items-center gap-3">
        <button onclick="toggleSidebar()" class="text-amber-400 text-2xl px-2">☰</button>
        <h1 class="font-extrabold text-sm tracking-wider text-amber-400">SMART GRILL POS</h1>
      </div>
    </header>

    <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-4 p-4 h-full overflow-hidden">
      
      <!-- Dynamic Database Menu Grid -->
      <div class="col-span-1 lg:col-span-8 overflow-y-auto pr-2 pb-20">
        <div id="dynamicMenuGrid" class="w-full">
          <!-- Javascript populates the exact layout here -->
        </div>
      </div>

      <!-- Cart & Billing Engine -->
      <div class="col-span-1 lg:col-span-4 glass-panel p-5 rounded-2xl flex flex-col shadow-2xl border border-slate-800 h-full">
        <div class="flex-1 flex flex-col overflow-hidden">
          <div class="flex justify-between items-center mb-3 border-b border-slate-800 pb-3 shrink-0">
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Current Order</h2>
            <div class="flex gap-2">
              <button onclick="holdCurrentOrder()" class="text-[10px] bg-amber-500/10 text-amber-400 px-3 py-1.5 rounded font-bold hover:bg-amber-500/20 shadow">Hold</button>
              <button onclick="requestAdminAction('cart_clear', 'all')" class="text-[10px] bg-red-500/10 text-red-400 px-3 py-1.5 rounded font-bold hover:bg-red-500/20 shadow">Clear</button>
            </div>
          </div>
          
          <div id="cartList" class="flex-1 overflow-y-auto space-y-2 pr-1 pb-4">
            <p class="text-slate-500 text-xs text-center py-10">No items selected yet.</p>
          </div>
        </div>

        <div class="border-t border-slate-800 pt-4 space-y-4 shrink-0">
          <div class="flex justify-between items-center">
            <span class="text-sm font-bold text-slate-400">TOTAL AMOUNT</span>
            <span class="text-2xl font-black text-amber-400">KSh <span id="cartTotal">0.00</span></span>
          </div>
          <input type="hidden" id="paymentMethod" value="cash">
          <div class="grid grid-cols-3 gap-2">
            <button id="btn-cash" onclick="selectPaymentMethod('cash')" class="pay-btn py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs font-bold text-slate-200 ring-2 ring-amber-500">💵 Cash</button>
            <button id="btn-mpesa" onclick="selectPaymentMethod('mpesa')" class="pay-btn py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs font-bold text-slate-200">📱 M-Pesa</button>
            <button id="btn-partial" onclick="selectPaymentMethod('partial')" class="pay-btn py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs font-bold text-slate-200">⚖️ Partial</button>
          </div>
          <div id="partialFields" class="hidden space-y-2 bg-slate-900/50 p-3 rounded-xl border border-slate-800">
            <div>
              <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Cash Portion</label>
              <input type="number" id="cashInput" oninput="validatePaymentInputs()" value="0" class="w-full bg-slate-950 border border-slate-800 p-2 rounded text-xs text-amber-400 font-bold focus:outline-none focus:border-amber-500">
            </div>
            <div>
              <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">M-Pesa Portion</label>
              <input type="number" id="mpesaInput" oninput="validatePaymentInputs()" value="0" class="w-full bg-slate-950 border border-slate-800 p-2 rounded text-xs text-amber-400 font-bold focus:outline-none focus:border-amber-500">
            </div>
          </div>
          <div id="paymentError" class="hidden text-[11px] text-red-400 bg-red-500/10 p-2 rounded text-center border border-red-500/20 font-semibold"></div>
          <button id="checkoutBtn" onclick="submitOrder()" disabled class="w-full py-4 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black rounded-xl transition shadow-xl disabled:opacity-40 disabled:cursor-not-allowed">
            COMPLETE TRANSACTION
          </button>
        </div>
      </div>
    </main>
  </div>

  <!-- QUANTITY DROPDOWN MODAL -->
  <div id="qtyModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center z-50">
    <div class="glass-panel p-6 rounded-2xl w-full max-w-xs shadow-2xl border border-slate-700 text-center">
      <h3 class="font-extrabold text-sm text-slate-300 uppercase mb-4">Select Quantity for <br><span class="text-amber-400 text-lg" id="qtyItemName"></span></h3>
      
      <select id="qtySelect" class="w-full bg-slate-900 border border-slate-700 text-amber-400 rounded-lg p-3 mb-6 text-center text-xl font-black focus:outline-none focus:border-amber-500">
        <option value="1">1</option><option value="2">2</option><option value="3">3</option>
        <option value="4">4</option><option value="5">5</option><option value="6">6</option>
        <option value="7">7</option><option value="8">8</option><option value="9">9</option>
        <option value="10">10</option><option value="11">11</option><option value="12">12</option>
        <option value="13">13</option><option value="14">14</option><option value="15">15</option>
        <option value="16">16</option><option value="17">17</option><option value="18">18</option>
        <option value="19">19</option><option value="20">20</option>
      </select>
      
      <div class="flex gap-2">
        <button onclick="toggleModal('qtyModal')" class="flex-1 py-3 bg-slate-800 text-slate-300 rounded-lg font-bold hover:bg-slate-700 transition">Cancel</button>
        <button onclick="confirmQtyAdd()" class="flex-1 py-3 bg-amber-500 text-slate-950 rounded-lg font-black hover:bg-amber-400 transition shadow-lg">ADD</button>
      </div>
    </div>
  </div>

  <!-- Holds Modal -->
  <div id="holdsModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center z-50">
    <div class="glass-panel p-6 rounded-2xl w-full max-w-md shadow-2xl border border-slate-700">
      <div class="flex justify-between items-center mb-4 border-b border-slate-800 pb-3">
        <h3 class="font-extrabold text-sm tracking-wider text-slate-200 uppercase">⏸ Held Orders</h3>
        <button onclick="toggleModal('holdsModal')" class="text-slate-400 hover:text-white bg-slate-800 rounded-full h-8 w-8 flex items-center justify-center font-bold">✕</button>
      </div>
      <div id="holdList" class="max-h-[60vh] overflow-y-auto space-y-2 pr-2"></div>
    </div>
  </div>

  <!-- Receipts & Expenses -->
  <div id="receiptsModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center z-50">
    <div class="glass-panel p-6 rounded-2xl w-full max-w-md shadow-2xl border border-slate-700">
      <div class="flex justify-between items-center mb-4 border-b border-slate-800 pb-3">
        <h3 class="font-extrabold text-sm tracking-wider text-slate-200 uppercase">🧾 Shift Ledger</h3>
        <button onclick="toggleModal('receiptsModal')" class="text-slate-400 hover:text-white bg-slate-800 rounded-full h-8 w-8 flex items-center justify-center font-bold">✕</button>
      </div>
      <div id="receiptsList" class="max-h-[60vh] overflow-y-auto space-y-2 pr-2"></div>
    </div>
  </div>

  <!-- Expenses Modal -->
  <div id="expensesModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center z-50">
    <div class="glass-panel p-6 rounded-2xl w-full max-w-sm shadow-2xl border border-slate-700">
      <div class="flex justify-between items-center mb-4 border-b border-slate-800 pb-3">
        <h3 class="font-extrabold text-sm tracking-wider text-slate-200 uppercase">💸 Log Expense</h3>
        <button onclick="toggleModal('expensesModal')" class="text-slate-400 hover:text-white bg-slate-800 rounded-full h-8 w-8 flex items-center justify-center font-bold">✕</button>
      </div>
      <form onsubmit="submitExpense(event)" class="space-y-4 mt-2">
        <div>
            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Description</label>
            <input type="text" id="expDesc" required placeholder="e.g. Tomatoes for Kachumbari" class="w-full p-2.5 bg-slate-900 border border-slate-800 rounded text-xs text-white focus:outline-none focus:border-amber-500">
        </div>
        <div>
            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Amount (Max 1000)</label>
            <input type="number" id="expAmt" required max="1000" min="1" placeholder="Amount" class="w-full p-2.5 bg-slate-900 border border-slate-800 rounded text-xs text-amber-400 font-bold focus:outline-none focus:border-amber-500">
        </div>
        <div>
            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Paid Via</label>
            <select id="expType" class="w-full p-2.5 bg-slate-900 border border-slate-800 rounded text-xs text-white focus:outline-none focus:border-amber-500">
                <option value="Cash">Cash Drawer</option>
                <option value="Mpesa">M-Pesa / Till</option>
            </select>
        </div>
        <button type="submit" class="w-full py-3 mt-2 bg-amber-500 hover:bg-amber-400 text-slate-900 font-bold rounded shadow-lg transition">Save Expense</button>
      </form>
    </div>
  </div>

  <!-- Admin Verification Auth Modal -->
  <div id="adminModal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md hidden flex items-center justify-center z-50">
    <div class="glass-panel p-8 rounded-2xl max-w-sm w-full text-center space-y-4 border border-red-500/20 shadow-[0_0_50px_rgba(239,68,68,0.15)]">
      <h3 class="font-extrabold text-sm text-slate-200 uppercase tracking-wider">🔒 Admin Authorization</h3>
      <p class="text-xs text-slate-400">Scan QR or enter the 6-digit code in the Executive App to approve this deletion.</p>
      <div class="flex justify-center py-4"><div id="adminQrCode" class="p-3 bg-white rounded-xl shadow-inner"></div></div>
      <p class="text-3xl font-mono font-black tracking-[0.2em] text-amber-400 bg-slate-900 py-3 rounded-lg border border-slate-800" id="adminShortCode"></p>
      <button onclick="clearInterval(deletePollInterval); toggleModal('adminModal')" class="w-full py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold rounded-lg transition mt-4">Cancel Request</button>
    </div>
  </div>

  <script src="/assets/js/pos.js"></script>
</body>
</html>
