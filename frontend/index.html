<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Grill — Secure Portal Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="min-h-screen flex items-center justify-center relative p-4">

  <!-- Background Aesthetics -->
  <div class="absolute inset-0 bg-[radial-gradient(circle_at_top_right,#1e293b,transparent_50%)]"></div>

  <div class="glass-panel max-w-md w-full p-8 rounded-2xl shadow-2xl relative z-10 space-y-6">
    <div class="text-center space-y-2">
      <div class="inline-block p-3 rounded-full bg-amber-500/10 text-amber-500 mb-2">🔥</div>
      <h1 class="text-2xl font-extrabold tracking-wider text-white">SMART GRILL POS</h1>
      <p class="text-xs text-slate-400">Authorized Personnel Sign In</p>
    </div>

    <div id="alertBox" class="hidden p-3 rounded-lg bg-red-500/10 border border-red-500/30 text-red-400 text-xs font-semibold text-center"></div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-300 uppercase mb-2">Username</label>
        <input type="text" id="username" required class="w-full px-4 py-3 bg-slate-900/90 border border-slate-800 rounded-xl text-slate-100 text-sm focus:outline-none focus:border-amber-500 transition">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-300 uppercase mb-2">4-Digit PIN</label>
        <input type="password" id="pin" required maxlength="4" class="w-full px-4 py-3 bg-slate-900/90 border border-slate-800 rounded-xl text-slate-100 text-sm focus:outline-none focus:border-amber-500 transition tracking-[0.5em] text-center font-mono">
      </div>

      <button type="submit" class="w-full py-3.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl transition shadow-lg active:scale-95 text-sm">
        SIGN IN TO POS TERMINAL
      </button>
    </form>
  </div>

  <script src="assets/js/auth.js"></script>
</body>
</html>
