<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Grill — Cashier Login</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔥</text></svg>">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- TAILWIND DARK MODE CONFIGURATION -->
  <script>
      tailwind.config = {
          darkMode: 'class'
      }
  </script>
  
  <link rel="stylesheet" href="style.css">
  <script>
      // Initialize theme safely before rendering
      if (!localStorage.getItem('sg_theme')) {
          localStorage.setItem('sg_theme', 'light');
      }
      if (localStorage.getItem('sg_theme') === 'dark') {
          document.documentElement.classList.add('dark');
      }
  </script>
</head>
<body class="min-h-screen flex items-center justify-center relative p-4 bg-slate-50 dark:bg-slate-950 transition-colors duration-200">

  <!-- THEME TOGGLE BUTTON -->
  <button onclick="toggleTheme()" class="absolute top-5 right-5 px-3.5 py-2.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-200 shadow-sm hover:bg-slate-100 dark:hover:bg-slate-800 transition z-20 flex items-center gap-2 text-xs font-bold">
    <span id="themeIcon">🌙</span> <span class="hidden sm:inline">Theme</span>
  </button>

  <div class="absolute inset-0 bg-[radial-gradient(circle_at_top_right,#e2e8f0,transparent_60%)] dark:bg-[radial-gradient(circle_at_top_right,#1e293b,transparent_50%)] pointer-events-none"></div>

  <!-- Main Login Card perfectly matching admin styling -->
  <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 max-w-md w-full p-8 rounded-2xl shadow-xl relative z-10 space-y-6">
    <div class="text-center space-y-2">
      <div class="inline-flex w-14 h-14 rounded-2xl bg-indigo-50 dark:bg-indigo-500/10 items-center justify-center text-2xl text-indigo-600 dark:text-indigo-400 mb-1 shadow-sm border border-indigo-100 dark:border-indigo-500/20">🔥</div>
      <h1 class="text-2xl font-black tracking-wide text-slate-900 dark:text-white">SMART GRILL</h1>
      <p class="text-xs font-semibold text-slate-500 dark:text-slate-400">Cashier Terminal Login Portal</p>
    </div>

    <div id="alertBox" class="hidden p-3 rounded-xl bg-red-50 dark:bg-red-500/10 border border-red-200 dark:border-red-500/30 text-red-600 dark:text-red-400 text-xs font-semibold text-center break-words"></div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2">Select Branch</label>
        <select id="branchSelect" required class="w-full px-4 py-3.5 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl text-slate-900 dark:text-slate-100 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition shadow-sm">
          <option value="" disabled selected>-- Select Your Branch --</option>
          <option value="Smartgrill">Smartgrill</option>
          <option value="nyama villa">nyama villa</option>
          <option value="Smart kitchen">Smart kitchen</option>
          <option value="Smart Resort">Smart Resort</option>
          <option value="Smart Villa">Smart Villa</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2">Username</label>
        <input type="text" id="username" required placeholder="Enter username" class="w-full px-4 py-3.5 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl text-slate-900 dark:text-slate-100 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition shadow-sm">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2">4-Digit PIN</label>
        <input type="password" id="pin" required maxlength="4" placeholder="••••" class="w-full px-4 py-3.5 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl text-slate-900 dark:text-slate-100 text-base focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition tracking-widest text-center font-mono shadow-sm">
      </div>

      <button type="submit" id="submitBtn" class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition shadow-md active:scale-95 text-xs uppercase tracking-wider flex justify-center items-center mt-2">
        <svg id="btnSpinner" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span id="btnText">Sign In to Terminal</span>
      </button>
    </form>
  </div>

  <script>
      function updateIcon() {
          const isDark = document.documentElement.classList.contains('dark');
          const icon = document.getElementById('themeIcon');
          if (icon) icon.innerText = isDark ? '☀️' : '🌙';
      }

      function toggleTheme() {
          const root = document.documentElement;
          root.classList.toggle('dark');
          const newTheme = root.classList.contains('dark') ? 'dark' : 'light';
          localStorage.setItem('sg_theme', newTheme);
          updateIcon();
      }

      document.addEventListener("DOMContentLoaded", updateIcon);
  </script>
  <script src="/assets/js/auth.js"></script>
</body>
</html>
