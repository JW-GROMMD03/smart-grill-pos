<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Vault | Restricted</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔥</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #020617; color: #f8fafc; }
        .vault-panel { background: #0f172a; border: 1px solid #334155; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center font-mono p-4">

    <div class="vault-panel w-full max-w-md p-8 rounded-lg shadow-2xl relative">
        <div class="text-center mb-6">
            <svg class="w-12 h-12 text-rose-500 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.078 2.027-.231 3.021M15.528 9H14v-.5M12 2a10 10 0 100 20 10 10 0 000-20z"></path></svg>
            <h1 class="text-xl tracking-widest text-rose-500 font-bold uppercase">Restricted Vault</h1>
            <p id="subTitle" class="text-xs text-slate-400 mt-2">Level 4 Multi-Factor Challenge</p>
        </div>

        <div id="statusAlert" class="hidden text-sm p-3 rounded bg-slate-800 border mb-4"></div>

        <!-- Step 1: Security Questions Form -->
        <form id="questionForm" onsubmit="verifyQuestions(event)" class="space-y-4">
            <p class="text-xs text-amber-400">Answer security verification prompts:</p>
            <div>
                <label class="block text-xs text-slate-400 mb-1">1. What was your childhood pet's name?</label>
                <input type="text" id="ans1" required class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-white outline-none focus:border-rose-500">
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">2. In what city were you born?</label>
                <input type="text" id="ans2" required class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-white outline-none focus:border-rose-500">
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">3. What is your mother's maiden name?</label>
                <input type="text" id="ans3" required class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-white outline-none focus:border-rose-500">
            </div>
            <button type="submit" id="qBtn" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-3 rounded transition uppercase tracking-widest text-sm mt-4">
                Verify Answers
            </button>
        </form>

        <!-- Step 2: New Password Form (Hidden Initially) -->
        <form id="passwordForm" onsubmit="submitNewPassword(event)" class="space-y-5 hidden">
            <div>
                <label class="block text-xs text-slate-400 mb-1">New Admin Password</label>
                <input type="password" id="newPassword" required class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-white outline-none focus:border-rose-500">
            </div>
            <button type="submit" id="pBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded transition uppercase tracking-widest text-sm mt-4">
                Commit New Credentials
            </button>
        </form>
    </div>

    <script>
        let authorizedToken = "";
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        async function verifyQuestions(e) {
            e.preventDefault();
            const alert = document.getElementById('statusAlert');
            const a1 = document.getElementById('ans1').value;
            const a2 = document.getElementById('ans2').value;
            const a3 = document.getElementById('ans3').value;

            try {
                const res = await fetch('/api/v1/admin/vault/verify-questions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, a1, a2, a3 })
                });
                const data = await res.json();
                if (res.ok) {
                    authorizedToken = data.auth_token;
                    document.getElementById('questionForm').classList.add('hidden');
                    document.getElementById('passwordForm').classList.remove('hidden');
                    document.getElementById('subTitle').innerText = "Identity Confirmed — Rotate Password";
                    alert.classList.add('hidden');
                } else {
                    throw new Error(data.detail);
                }
            } catch (err) {
                alert.className = "text-sm p-3 rounded bg-rose-900/50 border border-rose-500 text-rose-400 mb-4";
                alert.innerText = err.message;
                alert.classList.remove('hidden');
            }
        }

        async function submitNewPassword(e) {
            e.preventDefault();
            const alert = document.getElementById('statusAlert');
            const newPassword = document.getElementById('newPassword').value;

            try {
                const res = await fetch('/api/v1/admin/vault/execute-reset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: authorizedToken, new_password: newPassword })
                });
                const data = await res.json();
                if (res.ok) {
                    alert.className = "text-sm p-3 rounded bg-emerald-900/50 border border-emerald-500 text-emerald-400 mb-4";
                    alert.innerText = "Success: " + data.message;
                    alert.classList.remove('hidden');
                    document.getElementById('passwordForm').classList.add('hidden');
                } else {
                    throw new Error(data.detail);
                }
            } catch (err) {
                alert.className = "text-sm p-3 rounded bg-rose-900/50 border border-rose-500 text-rose-400 mb-4";
                alert.innerText = err.message;
                alert.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
